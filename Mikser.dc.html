<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- og:start -->
<title>Stil Mikseri — Style Mixer</title>
<meta name="description" content="Blend any two of 85 design styles into one AI-ready prompt. İki stili tek prompt&#x27;ta harmanla.">
<link rel="canonical" href="https://design.asveas.com/Mikser.dc.html">

<meta property="og:locale:alternate" content="en_US">

<meta name="theme-color" content="#14120e">
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "Stil Mikseri — Style Mixer", "url": "https://design.asveas.com/Mikser.dc.html", "applicationCategory": "DesignApplication", "inLanguage": ["tr", "en"], "description": "Blend any two of 85 design styles into one AI-ready prompt. İki stili tek prompt'ta harmanla.", "isPartOf": {"@type": "WebSite", "name": "Tasarım Standartları Kataloğu", "alternateName": "Design Standards Catalog", "url": "https://design.asveas.com/", "inLanguage": ["tr", "en"]}}</script>
<!-- og:end -->
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;padding:0;background:#14120e}
a{color:inherit;text-decoration:none}
::selection{background:#e07a52;color:#17130d}
.msec{background:#1c1914;border:1px solid rgba(242,237,227,.14);border-radius:14px;padding:20px;min-width:0}
.monizleme{position:relative;width:100%;height:170px;overflow:hidden;border-radius:9px;background:#fff;margin-top:12px}
.monizleme iframe{position:absolute;top:0;left:0;width:1440px;height:900px;border:0;transform:scale(.2667);transform-origin:top left;pointer-events:none}
@media (max-width:760px){.mgrid{grid-template-columns:1fr !important}.mgrid .morta{flex-direction:row !important}}
.mbtn{display:inline-flex;align-items:center;gap:8px;font:12px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;padding:11px 16px;border:1px solid rgba(242,237,227,.25);border-radius:9px;background:transparent;color:#f2ede3;cursor:pointer;transition:border-color .15s,color .15s}
.mbtn:hover{border-color:#e07a52;color:#e07a52}
.mbtn.dolu{background:#e07a52;border-color:#e07a52;color:#17130d;font-weight:700}
.msel{width:100%;background:#14120e;border:1px solid rgba(242,237,227,.25);border-radius:9px;color:#f2ede3;font:14px/1.4 'Helvetica Neue',Helvetica,Arial,sans-serif;padding:11px 12px;cursor:pointer}
</style>
</helmet>
<div style="background:#14120e;color:#f2ede3;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;min-height:100vh;padding-bottom:60px">

  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:20px 40px 0;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase">
    <a href="Katalog.dc.html" style-hover="color:#e07a52">← Katalog</a>
    <span style="display:flex;gap:18px;align-items:baseline"><button onclick="{{ onLang }}" style="background:none;border:1px solid rgba(242,237,227,.25);border-radius:5px;color:rgba(242,237,227,.65);font:inherit;letter-spacing:inherit;text-transform:inherit;padding:3px 8px;cursor:pointer">{{ langLabel }}</button><span style="color:#e07a52">{{ t.tag }}</span></span>
  </div>

  <div style="max-width:1000px;margin:0 auto;padding:36px 24px 0">
    <h1 style="font-size:36px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:0 0 10px;text-align:center">{{ t.h1 }}</h1>
    <p style="font-size:15px;line-height:1.6;color:rgba(242,237,227,.6);text-align:center;max-width:52ch;margin:0 auto 30px">{{ t.p }}</p>

    <sc-if value="{{ hazir }}">
    <div class="mgrid" style="display:grid;grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr);gap:14px;align-items:stretch">
      <div class="msec">
        <div style="font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#e07a52;margin-bottom:10px">{{ t.a }}</div>
        {{ selA }}
        <div style="display:flex;gap:6px;margin-top:12px"><sc-for list="{{ aPal }}" as="hex"><span style="width:16px;height:16px;border-radius:50%;border:1px solid rgba(242,237,227,.3);background:{{ hex }}"></span></sc-for></div>
        <div class="monizleme"><iframe src="{{ aFile }}" loading="lazy" scrolling="no" title="A"></iframe></div>
      </div>
      <div class="morta" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
        <button class="mbtn" onclick="{{ onSwap }}" title="{{ t.swap }}" style="padding:11px 12px">⇄</button>
        <button class="mbtn" onclick="{{ onRandom }}" title="{{ t.rnd }}" style="padding:11px 12px">🎲</button>
      </div>
      <div class="msec">
        <div style="font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7fbf8e;margin-bottom:10px">{{ t.b }}</div>
        {{ selB }}
        <div style="display:flex;gap:6px;margin-top:12px"><sc-for list="{{ bPal }}" as="hex"><span style="width:16px;height:16px;border-radius:50%;border:1px solid rgba(242,237,227,.3);background:{{ hex }}"></span></sc-for></div>
        <div class="monizleme"><iframe src="{{ bFile }}" loading="lazy" scrolling="no" title="B"></iframe></div>
      </div>
    </div>

    <div class="msec" style="margin-top:14px;border-color:rgba(224,122,82,.4)">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap">
        <div style="font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#e07a52">{{ baslik }}</div>
        <div style="display:flex;gap:8px">
          <button class="mbtn dolu" onclick="{{ onKopyala }}">{{ kopyaLabel }}</button>
          <button class="mbtn" onclick="{{ onLink }}">{{ linkLabel }}</button>
        </div>
      </div>
      <div style="font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.85;background:rgba(242,237,227,.05);border:1px solid rgba(242,237,227,.16);border-radius:9px;padding:18px;user-select:all;white-space:pre-wrap">{{ prompt }}</div>
    </div>
    </sc-if>

    <sc-if value="{{ yukleniyor }}"><div style="padding:100px 0;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,237,227,.45)">{{ t.loading }}</div></sc-if>
  </div>

  <div style="max-width:1000px;margin:40px auto 0;padding:16px 24px 0;border-top:1px solid rgba(242,237,227,.12);display:flex;justify-content:space-between;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(242,237,227,.35)">
    <span>design.asveas.com/Mikser</span><span>{{ t.foot }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const STR = {
  tr: { tag:'Stil Mikseri', h1:'İki stili karıştır, tek prompt al', p:'Biri görsel dili verir, diğeri uygulama iskeletini. 85 stilden 7.140 farklı harman — Hokusai bir bankacılık uygulaması giydirsin, Bloomberg bir günlük tutsun.',
        a:'Görsel dil — nasıl görünsün?', b:'İskelet — ne olsun?', swap:'İkisini yer değiştir', rnd:'Rastgele çift', loading:'stiller yükleniyor…',
        kopya:'⧉ promptu kopyala', kopyaOk:'✓ kopyalandı', link:'🔗 harman linki', linkOk:'✓ link panoda', harman:'Harman', foot:'harmanı beğendiysen linkini paylaş' },
  en: { tag:'Style Mixer', h1:'Mix two styles, get one prompt', p:'One gives the visual language, the other the app skeleton. 7,140 blends from 85 styles — let Hokusai dress a banking app, let Bloomberg keep a diary.',
        a:'Visual language — how should it look?', b:'Skeleton — what should it be?', swap:'Swap the two', rnd:'Random pair', loading:'loading styles…',
        kopya:'⧉ copy prompt', kopyaOk:'✓ copied', link:'🔗 blend link', linkOk:'✓ link copied', harman:'Blend', foot:'liked the blend? share its link' }
};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let a = 67, b = 57;
    try {
      const m = (new URLSearchParams(location.search).get('mix') || '').split(/[+ ]/);
      if (m.length === 2) { a = parseInt(m[0], 10) || a; b = parseInt(m[1], 10) || b; }
    } catch (e) {}
    let lang = 'tr';
    try { const q = new URLSearchParams(location.search).get('lang'); lang = q === 'en' ? 'en' : q === 'tr' ? 'tr' : (localStorage.getItem('katalogLang') || 'tr'); } catch (e) {}
    this.state = { a, b, data: null, kopya: false, link: false, lang: lang === 'en' ? 'en' : 'tr' };
    try { document.documentElement.lang = this.state.lang; } catch (e) {}
    this.onLang = () => this.setState(s => { const l = s.lang === 'tr' ? 'en' : 'tr'; try { localStorage.setItem('katalogLang', l); } catch (e) {} try { document.documentElement.lang = l; } catch (e) {} return { lang: l }; });
    this.onSelA = (e) => this._set(+e.target.value, this.state.b);
    this.onSelB = (e) => this._set(this.state.a, +e.target.value);
    this.onSwap = () => this._set(this.state.b, this.state.a);
    this.onRandom = () => {
      const n = this.state.data.styles.length;
      let a2 = 1 + Math.floor(Math.random() * n), b2 = 1 + Math.floor(Math.random() * n);
      if (a2 === b2) b2 = (b2 % n) + 1;
      this._set(a2, b2);
    };
    this.onKopyala = () => this._copy(this._prompt(), 'kopya');
    this.onLink = () => this._copy('https://design.asveas.com/Mikser.dc.html?mix=' + this.state.a + '+' + this.state.b, 'link');
  }
  _set(a, b) {
    this.setState({ a, b });
    try { history.replaceState(null, '', '?mix=' + a + '+' + b); } catch (e) {}
  }
  _copy(text, key) {
    navigator.clipboard.writeText(text).then(() => {
      this.setState({ [key]: true });
      clearTimeout(this._t); this._t = setTimeout(() => this.setState({ kopya: false, link: false }), 1600);
    }).catch(() => {});
  }
  componentDidMount() {
    fetch('ai/catalog.json').then(r => r.json())
      .then(d => this.setState({ data: d })).catch(() => {});
  }
  componentWillUnmount() { clearTimeout(this._t); }
  _stil(id) {
    const d = this.state.data;
    return d && (d.styles.find(s => s.id === id) || d.styles[0]);
  }
  _prompt() {
    const A = this._stil(this.state.a), B = this._stil(this.state.b);
    if (!A || !B) return '';
    const ilkCumle = (B.prompt_en.split('. ')[0] || B.prompt_en) + '.';
    const an = A.name_en || A.name, bn = B.name_en || B.name;
    return 'STYLE MASHUP — skeleton: "' + bn + '" × skin: "' + an + '" (' + A.reference + ')\n\n'
      + 'BASE APP / STRUCTURE — ' + bn + ': ' + ilkCumle + ' Keep this app’s structure, modules and content.\n\n'
      + 'VISUAL SKIN — ' + an + ': repaint every visual decision in this language.\n'
      + '- Palette: ' + (A.palette || []).join(', ') + '\n'
      + '- Typography: ' + A.typography + '\n'
      + '- Layout character: ' + A.layout + '\n'
      + '- Motion: ' + A.motion + '\n'
      + '- Avoid: ' + A.avoid + '\n\n'
      + 'The result must function as "' + bn + '" but read at first glance as "' + an + '".';
  }
  renderVals() {
    const st = this.state, d = st.data;
    const L = STR[st.lang] || STR.tr, en = st.lang === 'en';
    const adOf = (x) => en ? (x.name_en || x.name) : x.name;
    const base = {
      t: L, langLabel: en ? 'TR' : 'EN', onLang: this.onLang,
      hazir: !!d, yukleniyor: !d,
      onSwap: this.onSwap, onRandom: this.onRandom,
      onKopyala: this.onKopyala, onLink: this.onLink,
      kopyaLabel: st.kopya ? L.kopyaOk : L.kopya,
      linkLabel: st.link ? L.linkOk : L.link,
      selA: null, selB: null, aPal: [], bPal: [], aFile: '', bFile: '', baslik: '', prompt: ''
    };
    if (!d) return base;
    const A = this._stil(st.a), B = this._stil(st.b);
    const opt = (s) => React.createElement('option', { key: s.id, value: s.id },
      String(s.id).padStart(2, '0') + ' — ' + adOf(s));
    const sel = (val, onCh) => React.createElement('select',
      { className: 'msel', value: val, onChange: onCh }, d.styles.map(opt));
    return { ...base,
      selA: sel(st.a, this.onSelA), selB: sel(st.b, this.onSelB),
      aPal: A.palette || [], bPal: B.palette || [],
      aFile: A.file, bFile: B.file,
      baslik: L.harman + ' ' + String(st.a).padStart(2, '0') + ' × ' + String(st.b).padStart(2, '0') + ' — ' + adOf(A) + ' × ' + adOf(B),
      prompt: this._prompt()
    };
  }
}
</script>
</body>
</html>
